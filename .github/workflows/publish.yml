name: Publish

on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. 2.3.3)
        required: true
        type: string
      marketplace:
        description: Publish to Visual Studio Marketplace
        type: boolean
        default: true
      openvsx:
        description: Publish to Open VSX Registry
        type: boolean
        default: false
      artifact:
        description: Upload VSIX artifact
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: true
          cache: true

      - name: Validate tag against package version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a release version."
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag '$TAG' does not match package.json version '$PACKAGE_VERSION'."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package extension
        run: pnpm dlx @vscode/vsce@4 package --changelog-path CHANGELOG.md

      - name: Publish to Visual Studio Marketplace
        if: github.event_name != 'workflow_dispatch' || inputs.marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm dlx @vscode/vsce@4 publish --packagePath "variable-conversion-${VERSION}.vsix" -p "$VSCE_PAT" --skip-duplicate

      - name: Publish to Open VSX Registry
        # tag pushes stay disabled until the Open VSX publisher rename is resolved
        if: false
        # if: github.event_name != 'workflow_dispatch' || inputs.openvsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm dlx ovsx@1 publish "variable-conversion-${VERSION}.vsix" -p "$OVSX_PAT" --skip-duplicate

      - name: Attach VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          # Release notes come from this version's CHANGELOG section; fall back to generated notes when absent.
          if pnpm run changelog "$VERSION" --out release-notes.md; then
            NOTES="--notes-file release-notes.md"
          else
            echo "::notice::CHANGELOG.md has no section for $VERSION, falling back to generated notes."
            NOTES="--generate-notes"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" $NOTES --verify-tag
          gh release upload "$TAG" "variable-conversion-${VERSION}.vsix" --clobber

      - name: Upload VSIX artifact
        if: github.event_name != 'workflow_dispatch' || inputs.artifact
        uses: actions/upload-artifact@v7
        with:
          name: variable-conversion-${{ env.VERSION }}
          path: variable-conversion-${{ env.VERSION }}.vsix
          if-no-files-found: error
